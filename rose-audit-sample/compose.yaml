services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rose_audit
      POSTGRES_USER: rose_audit
      POSTGRES_PASSWORD: rose_audit_local
    ports:
      - "${AUDIT_DB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rose_audit -d rose_audit"]
      interval: 2s
      timeout: 2s
      retries: 15
